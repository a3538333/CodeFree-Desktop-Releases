name: verify-release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Desktop version, with or without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: verify-release-${{ github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name || inputs.version }}
      RELEASE_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install metadata parser
        run: python -m pip install PyYAML==6.0.2
      - name: Verify every published package
        run: python script/verify-release.py
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-${{ env.RELEASE_VERSION }}
          path: release-verification.json
          retention-days: 3
          if-no-files-found: ignore
